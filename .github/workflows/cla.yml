name: CLA Assistant

# Migrated to the org-level reusable workflow (scitex-ai/.github, 2026-07-10
# incident remediation; ground-truth pilot: scitex-ai/scitex-stats PR #69).
# `owner_allowlist` is overridden because this repo's allowlist carries an
# extra login (`LLEmacs`) beyond the reusable default (`bot*,ywatanabe1989`).
# Note: the OLD job hardcoded the CLA-document URL to
# `ywatanabe1989/scitex-dev/blob/main/CLA.md` even though this repo ships
# its own `CLA.md` at the root — the reusable workflow instead builds the
# URL from `${{ github.repository }}` (this repo), which is more correct
# now that CLA.md lives here too.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
    secrets: inherit